<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="Numerical back projection example"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#006e78"/></marker></defs><rect width="960" height="420" fill="#eef4f8"/><g font-family="Arial, sans-serif"><text x="35" y="44" font-size="20" fill="#006e78" font-weight="700" text-anchor="start">IMAGE COORDINATES → CAMERA → WORLD</text><rect x="35" y="90" width="255" height="170" rx="7" fill="#fff" stroke="#8aa4b2"/><text x="53" y="125" font-size="21" fill="#173247" font-weight="650" text-anchor="start">Pixel + depth</text><text x="53" y="156" font-size="18" fill="#173247" font-weight="500" text-anchor="start">u = 380, v = 270</text><text x="53" y="205" font-size="26" fill="#006e78" font-weight="650" text-anchor="start">z = 2 m</text><rect x="350" y="90" width="255" height="170" rx="7" fill="#fff" stroke="#8aa4b2"/><text x="368" y="125" font-size="21" fill="#173247" font-weight="650" text-anchor="start">Camera point</text><text x="368" y="156" font-size="18" fill="#173247" font-weight="500" text-anchor="start">p_c = (0.20, 0.10, 2)</text><rect x="665" y="90" width="260" height="170" rx="7" fill="#fff" stroke="#8aa4b2"/><text x="683" y="125" font-size="21" fill="#173247" font-weight="650" text-anchor="start">World point</text><text x="683" y="156" font-size="18" fill="#173247" font-weight="500" text-anchor="start">p_w = (1.20, 0.10, 2)</text><path d="M290,174 L344,174" fill="none" stroke="#006e78" stroke-width="3" marker-end="url(#arrow)"/><path d="M605,174 L659,174" fill="none" stroke="#006e78" stroke-width="3" marker-end="url(#arrow)"/><text x="318" y="305" font-size="25" fill="#006e78" font-weight="650" text-anchor="middle">z K⁻¹ [u,v,1]ᵀ</text><text x="635" y="305" font-size="25" fill="#006e78" font-weight="650" text-anchor="middle">R_wc p_c + t_wc</text><text x="35" y="375" font-size="20" fill="#173247" font-weight="500" text-anchor="start">Example: fx = fy = 600 px; principal point (320,240); R = I; t = (1,0,0) m</text></g></svg>