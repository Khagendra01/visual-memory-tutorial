<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="Proposed observation and retrieval pipeline"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#006e78"/></marker></defs><rect width="960" height="420" fill="#eef4f8"/><g font-family="Arial, sans-serif"><text x="35" y="42" font-size="17" fill="#006e78" font-weight="700" text-anchor="start">OBSERVE</text><rect x="35" y="65" width="250" height="85" rx="7" fill="#fff" stroke="#8aa4b2"/><text x="53" y="100" font-size="21" fill="#173247" font-weight="650" text-anchor="start">Camera + sensors</text><text x="53" y="131" font-size="18" fill="#173247" font-weight="500" text-anchor="start">frames, depth, pose</text><rect x="350" y="65" width="250" height="85" rx="7" fill="#fff" stroke="#8aa4b2"/><text x="368" y="100" font-size="21" fill="#173247" font-weight="650" text-anchor="start">Perception</text><text x="368" y="131" font-size="18" fill="#173247" font-weight="500" text-anchor="start">identity + 3D position</text><rect x="665" y="65" width="260" height="85" rx="7" fill="#fff" stroke="#8aa4b2"/><text x="683" y="100" font-size="21" fill="#173247" font-weight="650" text-anchor="start">Local memory</text><text x="683" y="131" font-size="18" fill="#173247" font-weight="500" text-anchor="start">time + evidence + map</text><path d="M285,107 L344,107" fill="none" stroke="#006e78" stroke-width="3" marker-end="url(#arrow)"/><path d="M600,107 L659,107" fill="none" stroke="#006e78" stroke-width="3" marker-end="url(#arrow)"/><text x="35" y="235" font-size="17" fill="#006e78" font-weight="700" text-anchor="start">RETRIEVE</text><rect x="35" y="255" width="250" height="90" rx="7" fill="#fff" stroke="#8aa4b2"/><text x="53" y="290" font-size="21" fill="#173247" font-weight="650" text-anchor="start">Object query</text><text x="53" y="321" font-size="18" fill="#173247" font-weight="500" text-anchor="start">enrolled name or crop</text><rect x="350" y="255" width="250" height="90" rx="7" fill="#fff" stroke="#8aa4b2"/><text x="368" y="290" font-size="21" fill="#173247" font-weight="650" text-anchor="start">Check evidence</text><text x="368" y="321" font-size="18" fill="#173247" font-weight="500" text-anchor="start">age + map alignment</text><rect x="665" y="255" width="260" height="90" rx="7" fill="#fff" stroke="#8aa4b2"/><text x="683" y="290" font-size="21" fill="#173247" font-weight="650" text-anchor="start">Last-seen answer</text><text x="683" y="321" font-size="18" fill="#173247" font-weight="500" text-anchor="start">image, place, time</text><path d="M285,300 L344,300" fill="none" stroke="#006e78" stroke-width="3" marker-end="url(#arrow)"/><path d="M600,300 L659,300" fill="none" stroke="#006e78" stroke-width="3" marker-end="url(#arrow)"/><path d="M795,150 V205 H475 V249" fill="none" stroke="#006e78" stroke-width="3" marker-end="url(#arrow)"/><text x="35" y="394" font-size="20" fill="#173247" font-weight="500" text-anchor="start">Proposed design • no continuous cloud upload required</text></g></svg>