<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="Failure gates for useful last-seen guidance"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#006e78"/></marker></defs><rect width="960" height="420" fill="#eef4f8"/><g font-family="Arial, sans-serif"><text x="35" y="43" font-size="20" fill="#006e78" font-weight="700" text-anchor="start">CHECK EACH CONDITION BEFORE GUIDANCE</text><rect x="40" y="83" width="260" height="90" rx="7" fill="#fff" stroke="#8aa4b2"/><text x="58" y="118" font-size="21" fill="#173247" font-weight="650" text-anchor="start">Observed?</text><text x="58" y="149" font-size="18" fill="#173247" font-weight="500" text-anchor="start">camera coverage</text><rect x="350" y="83" width="260" height="90" rx="7" fill="#fff" stroke="#8aa4b2"/><text x="368" y="118" font-size="21" fill="#173247" font-weight="650" text-anchor="start">Same instance?</text><text x="368" y="149" font-size="18" fill="#173247" font-weight="500" text-anchor="start">identity confidence</text><rect x="660" y="83" width="260" height="90" rx="7" fill="#fff" stroke="#8aa4b2"/><text x="678" y="118" font-size="21" fill="#173247" font-weight="650" text-anchor="start">Valid geometry?</text><text x="678" y="149" font-size="18" fill="#173247" font-weight="500" text-anchor="start">depth + pose quality</text><path d="M300,128 L344,128" fill="none" stroke="#006e78" stroke-width="3" marker-end="url(#arrow)"/><path d="M610,128 L654,128" fill="none" stroke="#006e78" stroke-width="3" marker-end="url(#arrow)"/><rect x="200" y="250" width="260" height="95" rx="7" fill="#fff" stroke="#8aa4b2"/><text x="218" y="285" font-size="21" fill="#173247" font-weight="650" text-anchor="start">Same map?</text><text x="218" y="316" font-size="18" fill="#173247" font-weight="500" text-anchor="start">session relocalization</text><rect x="520" y="250" width="300" height="95" rx="7" fill="#fff" stroke="#8aa4b2"/><text x="538" y="285" font-size="21" fill="#173247" font-weight="650" text-anchor="start">Useful answer?</text><text x="538" y="316" font-size="18" fill="#173247" font-weight="500" text-anchor="start">time + uncertainty + access</text><path d="M790,173 V212 H330 V244" fill="none" stroke="#006e78" stroke-width="3" marker-end="url(#arrow)"/><path d="M460,296 L514,296" fill="none" stroke="#006e78" stroke-width="3" marker-end="url(#arrow)"/><text x="35" y="396" font-size="21" fill="#173247" font-weight="500" text-anchor="start">A failure should change the answer, not disappear behind a confidence score.</text></g></svg>