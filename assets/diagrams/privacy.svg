<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="Local retention and data controls"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#006e78"/></marker></defs><rect width="960" height="420" fill="#eef4f8"/><g font-family="Arial, sans-serif"><rect x="35" y="55" width="890" height="315" rx="10" fill="#e5f2f0" stroke="#006e78" stroke-width="2"/><text x="62" y="93" font-size="20" fill="#006e78" font-weight="700" text-anchor="start">DEVICE BOUNDARY</text><rect x="65" y="135" width="235" height="95" rx="7" fill="#fff" stroke="#8aa4b2"/><text x="83" y="170" font-size="21" fill="#173247" font-weight="650" text-anchor="start">Transient frames</text><text x="83" y="201" font-size="18" fill="#173247" font-weight="500" text-anchor="start">discard raw frames</text><rect x="360" y="135" width="245" height="95" rx="7" fill="#fff" stroke="#8aa4b2"/><text x="378" y="170" font-size="21" fill="#173247" font-weight="650" text-anchor="start">Selected evidence</text><text x="378" y="201" font-size="18" fill="#173247" font-weight="500" text-anchor="start">crops + embeddings</text><rect x="665" y="135" width="225" height="95" rx="7" fill="#fff" stroke="#8aa4b2"/><text x="683" y="170" font-size="21" fill="#173247" font-weight="650" text-anchor="start">Spatial memory</text><text x="683" y="201" font-size="18" fill="#173247" font-weight="500" text-anchor="start">map + observations</text><path d="M300,183 L354,183" fill="none" stroke="#006e78" stroke-width="3" marker-end="url(#arrow)"/><path d="M605,183 L659,183" fill="none" stroke="#006e78" stroke-width="3" marker-end="url(#arrow)"/><text x="65" y="296" font-size="23" fill="#173247" font-weight="500" text-anchor="start">Visible capture controls</text><text x="360" y="296" font-size="23" fill="#173247" font-weight="500" text-anchor="start">Bounded retention</text><text x="665" y="296" font-size="23" fill="#173247" font-weight="500" text-anchor="start">User deletion</text><text x="35" y="410" font-size="20" fill="#173247" font-weight="500" text-anchor="start">Local data still needs protection, consent, and an explicit backup policy.</text></g></svg>